name: milo
description: Milo Companion - a living AI companion (Flutter, iOS + Android)
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.3.0
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_tts: ^4.0.2
  sensors_plus: ^5.0.1
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  record: ^6.0.0 # 6.x line: platform packages implement record_platform_interface 1.6 (5.x resolves a stale record_linux that does not compile)
  image_picker: ^1.1.2
  image: ^4.2.0
  google_mlkit_text_recognition: ^0.13.1
  flutter_secure_storage: ^10.0.0 # v10: win32 6 compatible (unblocks file_picker v12); Jetpack Crypto backend replaced by custom cipher + auto-migration
  cryptography: ^2.7.0
  crypto: ^3.0.3
  sqflite_sqlcipher: ^3.1.0+1
  path: ^1.9.0
  connectivity_plus: ^6.0.5
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0
  file_picker: ^12.0.0 # v12+: federated API (FilePicker.pickFile, no .platform/FilePickerResult); 8.x fails the android-34 AAR check
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/learn/
    - assets/fonts/OFL-Atkinson.txt
    - assets/fonts/OFL-Lexend.txt
    - assets/fonts/OFL-OpenDyslexic.txt
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Regular.ttf
        - asset: assets/fonts/Lexend-SemiBold.ttf
          weight: 600
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700

# Run once after `flutter create`:  dart run flutter_launcher_icons  &&  dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#E2E6FF"
  adaptive_icon_foreground: assets/branding/icon_fg.png
  remove_alpha_ios: true
flutter_native_splash:
  color: "#E9EDFF"
  image: assets/branding/splash.png
  android_12:
    color: "#E9EDFF"
    image: assets/branding/splash.png
