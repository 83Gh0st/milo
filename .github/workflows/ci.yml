name: ci
on: [push, pull_request]
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r gateway/requirements-dev.txt
      - run: cd gateway && python -m pytest -q
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter create --platforms=android,ios --project-name milo .
      - run: rm -f test/widget_test.dart # generated sample references MyApp, which this app does not have
      - run: |
          printf '%s\n' '-dontwarn com.google.mlkit.vision.text.**' >> android/app/proguard-rules.pro
          printf '%s\n' 'android.enableR8.fullMode=false' >> android/gradle.properties
          grep -n "proguard" android/app/build.gradle* || true # log whether the rules file is wired in
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded 2>&1 | tee flutter_test.log; test ${PIPESTATUS[0]} -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: flutter-test-log, path: flutter_test.log, if-no-files-found: warn}
      - run: flutter build apk --release --dart-define=API_BASE=https://arjun3314508--milo-gateway-staging-web.us-east.modal.run
      - name: Verify staging API base baked in
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK" || { echo 'APK missing' >&2; exit 1; }
          if grep -a -q 'api\.example\.com' "$APK"; then echo 'STAGING APK STILL CONTAINS api.example.com' >&2; exit 1; fi
          grep -a -q 'milo-gateway-staging-web\.us-east\.modal\.run' "$APK" || { echo 'STAGING API BASE MISSING FROM APK' >&2; exit 1; }
          echo "verified $(du -h "$APK" | cut -f1) staging APK: no placeholder, staging host present"
      - uses: actions/upload-artifact@v4
        with: {name: milo-android-apk, path: build/app/outputs/flutter-apk/app-release.apk, if-no-files-found: error}
  ios-compile-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter create --platforms=ios --project-name milo .
      - run: flutter pub get
      - run: |
          cd ios && pod install # explicit: makes the integration state inspectable; flutter build's own install becomes a no-op
          echo "=== versions ==="; pod --version; xcodebuild -version | head -2
          echo "=== workspace ==="; cat Runner.xcworkspace/contents.xcworkspacedata
          echo "=== runner-pods-refs ==="; grep -c 'Pods_Runner' Runner.xcodeproj/project.pbxproj || echo NO_PODS_RUNNER_REF
          echo "=== pods-support ==="; ls Pods/Target\ Support\ Files/ 2>&1 || echo NOPODSUPPORTFILES
      - run: flutter build ios --simulator --no-codesign --dart-define=API_BASE=https://api.example.com
